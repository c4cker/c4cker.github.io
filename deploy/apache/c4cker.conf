# Apache conserva los puertos públicos 80/443 para no interferir con Blackhole.
# Caddy sirve c4cker solamente en 127.0.0.1:8080; Apache termina TLS y le reenvía
# cada hostname con el Host original.

<VirtualHost *:80>
    ServerName c4cker.com
    ServerAlias www.c4cker.com blog.c4cker.com labs.c4cker.com api.c4cker.com

    Alias /.well-known/acme-challenge/ /var/www/certbot/.well-known/acme-challenge/
    <Directory /var/www/certbot/.well-known/acme-challenge/>
        Options None
        AllowOverride None
        Require all granted
    </Directory>

    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L,NE]
</VirtualHost>

<VirtualHost *:443>
    ServerName c4cker.com
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/c4cker.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/c4cker.com/privkey.pem
    IncludeOptional /etc/letsencrypt/options-ssl-apache.conf
    ProxyPreserveHost On
    ProxyRequests Off
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"
    ProxyPass / http://127.0.0.1:8080/
    ProxyPassReverse / http://127.0.0.1:8080/
</VirtualHost>

