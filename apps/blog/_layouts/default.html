<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <meta name="color-scheme" content="dark">
    <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
    <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  </head>
  <body>
    <a class="skip-link" href="#contenido">Saltar al contenido</a>
    <header class="site-header">
      <a class="brand" href="{{ '/' | relative_url }}">c4cker<span aria-hidden="true">_</span></a>
      <nav aria-label="Navegación principal">
        <a href="{{ '/blog/' | relative_url }}">Blog</a><a href="{{ '/writeups/' | relative_url }}">Writeups</a><a href="{{ '/proyectos/' | relative_url }}">Proyectos</a><a href="{{ '/desafios/' | relative_url }}">Desafíos</a><a href="{{ '/laboratorios/' | relative_url }}">Labs</a><a href="{{ '/comunidad/' | relative_url }}">Comunidad</a>
      </nav>
    </header>
    <main id="contenido">{{ content }}</main>
    <footer><span>c4cker.com</span><span>Aprendizaje responsable · {{ 'now' | date: '%Y' }}</span><a href="{{ '/privacidad/' | relative_url }}">Privacidad</a></footer>
    <script src="{{ '/assets/js/config.local.js' | relative_url }}"></script>
    <script src="{{ '/assets/js/site.js' | relative_url }}"></script>
  </body>
</html>
