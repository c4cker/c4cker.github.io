name: Verificar cambios

on:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run community:check
      - run: node scripts/astro.mjs labs check
      - run: C4CKER_TARGET=pages npm run build:main
      - run: C4CKER_TARGET=pages C4CKER_APP=labs npm run build:labs
        env:
          PUBLIC_SUPABASE_URL: ${{ vars.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      - uses: ruby/setup-ruby@354a1ad156761f5ee2b7b13fa8e09943a5e8d252 # v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
          working-directory: apps/blog
      - run: bundle exec jekyll build --source apps/blog --destination apps/blog/_site
