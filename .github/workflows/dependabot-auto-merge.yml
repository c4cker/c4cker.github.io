name: Auto-merge de Dependabot

# Activa el auto-merge en PRs de Dependabot de bajo riesgo. GitHub mergea solo
# cuando se cumplen las reglas de main (CI verde y revisión requerida).
on:
  pull_request:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  auto-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
      - name: Activar auto-merge (patch o minor)
        if: steps.meta.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Avisar actualización mayor
        if: steps.meta.outputs.update-type == 'version-update:semver-major'
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" --title "Actualización mayor para revisar: $DEPS" \
            --body "Dependabot abrió $PR_URL con un cambio de versión mayor ($DEPS). No se mergea solo: revisá si rompe algo antes de aprobarlo. @c4cker" \
            --assignee c4cker
        env:
          DEPS: ${{ steps.meta.outputs.dependency-names }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
