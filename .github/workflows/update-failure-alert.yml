name: Alerta de actualización rota

# Si los checks fallan en un PR de Dependabot o en main (incluida la revisión
# semanal de seguridad), abre un issue para que llegue la notificación.
on:
  workflow_run:
    workflows: ["Verificar cambios", "Security checks", "Publicar GitHub Pages"]
    types: [completed]

permissions:
  issues: write

jobs:
  alert:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      (github.event.workflow_run.actor.login == 'dependabot[bot]' || github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    steps:
      - run: |
          gh issue create --repo "$REPO" \
            --title "Falló \"$WORKFLOW\" en $BRANCH" \
            --body "El workflow **$WORKFLOW** falló en \`$BRANCH\` (actor: $ACTOR). Puede ser una actualización que rompe el build o una vulnerabilidad nueva. Detalle: $RUN_URL @c4cker" \
            --assignee c4cker
        env:
          REPO: ${{ github.repository }}
          WORKFLOW: ${{ github.event.workflow_run.name }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          ACTOR: ${{ github.event.workflow_run.actor.login }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
