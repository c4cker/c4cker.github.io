name: Publicar GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "apps/main/**"
      - "apps/labs/**"
      - "apps/blog/**"
      - "packages/**"
      - "scripts/**"
      - "challenges-sources/**"
      - "astro.config.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        with:
          enablement: true
      - run: npm run build:main
        env:
          PUBLIC_GOOGLE_FORM_URL: ${{ secrets.PUBLIC_GOOGLE_FORM_URL }}
          PUBLIC_GOOGLE_ENTRY_NAME: ${{ secrets.PUBLIC_GOOGLE_ENTRY_NAME }}
          PUBLIC_GOOGLE_ENTRY_EMAIL: ${{ secrets.PUBLIC_GOOGLE_ENTRY_EMAIL }}
          PUBLIC_GOOGLE_ENTRY_SUBJECT: ${{ secrets.PUBLIC_GOOGLE_ENTRY_SUBJECT }}
          PUBLIC_GOOGLE_ENTRY_MESSAGE: ${{ secrets.PUBLIC_GOOGLE_ENTRY_MESSAGE }}
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: ./dist/main
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
