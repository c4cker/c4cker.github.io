name: Publicar GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "apps/main/**"
      - "apps/labs/**"
      - "apps/blog/**"
      - "packages/**"
      - "scripts/**"
      - "workers/**"
      - "challenges-sources/**"
      - "supabase/migrations/**"
      - "astro.config.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        with:
          enablement: true
      - run: C4CKER_TARGET=pages npm run build:main
        env:
          PUBLIC_GOOGLE_FORM_URL: ${{ secrets.PUBLIC_GOOGLE_FORM_URL }}
          PUBLIC_GOOGLE_ENTRY_NAME: ${{ secrets.PUBLIC_GOOGLE_ENTRY_NAME }}
          PUBLIC_GOOGLE_ENTRY_EMAIL: ${{ secrets.PUBLIC_GOOGLE_ENTRY_EMAIL }}
          PUBLIC_GOOGLE_ENTRY_SUBJECT: ${{ secrets.PUBLIC_GOOGLE_ENTRY_SUBJECT }}
          PUBLIC_GOOGLE_ENTRY_MESSAGE: ${{ secrets.PUBLIC_GOOGLE_ENTRY_MESSAGE }}
      - run: C4CKER_TARGET=pages C4CKER_APP=labs npm run build:labs
        env:
          PUBLIC_SUPABASE_URL: ${{ vars.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      - uses: ruby/setup-ruby@354a1ad156761f5ee2b7b13fa8e09943a5e8d252 # v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
          working-directory: apps/blog
      - name: Construir artefacto estático unificado
        shell: bash
        run: |
          mkdir -p _site/blog
          cp -R dist/main/. _site/
          mkdir -p _site/labs
          cp -R dist/labs/. _site/labs/
          cp -R challenges-sources _site/challenges-sources
          cd apps/blog
          bundle exec jekyll build --baseurl /blog --destination ../../_site/blog
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: ./_site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
