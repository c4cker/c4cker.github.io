name: Publicar GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "apps/main/**"
      - "apps/labs/**"
      - "apps/blog/**"
      - "packages/**"
      - "scripts/**"
      - "challenges-sources/**"
      - "astro.config.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          enablement: true
      - run: npm run build:main
        env:
          PUBLIC_GOOGLE_FORM_URL: ${{ secrets.PUBLIC_GOOGLE_FORM_URL }}
          PUBLIC_GOOGLE_ENTRY_NAME: ${{ secrets.PUBLIC_GOOGLE_ENTRY_NAME }}
          PUBLIC_GOOGLE_ENTRY_EMAIL: ${{ secrets.PUBLIC_GOOGLE_ENTRY_EMAIL }}
          PUBLIC_GOOGLE_ENTRY_SUBJECT: ${{ secrets.PUBLIC_GOOGLE_ENTRY_SUBJECT }}
          PUBLIC_GOOGLE_ENTRY_MESSAGE: ${{ secrets.PUBLIC_GOOGLE_ENTRY_MESSAGE }}
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./dist/main
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
