<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Header Trace</title><style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono&family=Syne:wght@700;800&display=swap');
:root{color-scheme:dark;--ink:#e8efe9;--bg:#07100b;--line:#244934;--sig:#aaf7bb}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 10%,#173a25,transparent 35%),var(--bg);color:var(--ink);font:15px/1.6 'DM Mono',monospace}.shell{max-width:900px;margin:8vh auto;padding:32px;border:1px solid var(--line);background:#09150e;box-shadow:20px 20px 0 #041009}h1{font:800 clamp(3rem,10vw,7rem)/.8 Syne,sans-serif;letter-spacing:-.09em;margin:32px 0;color:var(--sig)}.bar{color:#7da58a;border-bottom:1px solid var(--line);padding-bottom:14px}.log{border-left:3px solid var(--sig);padding:18px 22px;background:#0c1b11}.muted{color:#88a391}.cursor{display:inline-block;width:.55em;background:var(--sig);animation:b 1s step-end infinite}@keyframes b{50%{opacity:0}}</style></head>
<body><main class="shell"><div class="bar">root@header-trace:~$ cat briefing.txt</div><h1>HEADER<br>TRACE<span class="cursor">&nbsp;</span></h1><section class="log"><p>Una aplicación dejó demasiadas huellas en su propia superficie.</p><p class="muted">Inventario inicial: documento · script · robots</p><p>Objetivo: encontrá el token único y envialo al ranking.</p></section></main><script src="assets/app.js"></script></body></html>
