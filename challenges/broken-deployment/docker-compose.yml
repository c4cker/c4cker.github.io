services:
  frontend:
    image: nginx:1.27-alpine
    ports: ["127.0.0.1:8082:80"]
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [api]
    networks: [deployment]
  api:
    build: ./api
    depends_on: [worker]
    networks: [deployment]
  worker:
    build: ./worker
    networks: [deployment]
networks:
  deployment:
    internal: true
