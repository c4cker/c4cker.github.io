services:
  gateway:
    image: nginx:1.27-alpine
    ports: ["127.0.0.1:8080:80"]
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [dashboard, internal-api]
    networks: [observatory]
  dashboard:
    image: nginx:1.27-alpine
    volumes:
      - ./dashboard:/usr/share/nginx/html:ro
    networks: [observatory]
  internal-api:
    build: ./internal-api
    networks: [observatory]
networks:
  observatory:
    internal: true
