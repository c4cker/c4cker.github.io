proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=lab_cache:10m inactive=10m;
server {
  listen 80;
  location /digest { proxy_pass http://app:3000; proxy_cache lab_cache; proxy_cache_key "$scheme$proxy_host$request_uri"; add_header X-Lab-Cache $upstream_cache_status; }
  location / { proxy_pass http://app:3000; }
}
